<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DISPLAY</title>
<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #ffffff;
    --header: #334155;
    --border: #475569;
    --hover: rgba(255,255,255,0.05);
}

.light {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --header: #cbd5e1;
    --border: #94a3b8;
    --hover: rgba(0,0,0,0.05);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    transition: background 0.3s, color 0.3s;
}

.topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    flex-wrap: wrap;
    gap: 15px;
}

h1 {
    font-size: 34px;
    text-align: center;
    flex: 1;
    min-width: 250px;
}

#relogio {
    font-size: 38px;
    font-weight: bold;
    font-family: 'Courier New', monospace;
    letter-spacing: 4px;
    background: rgba(0,0,0,0.4);
    padding: 8px 18px;
    border-radius: 12px;
    border: 2px solid var(--border);
    white-space: nowrap;
}

.container {
    background: var(--card);
    border-radius: 15px;
    overflow-x: auto;
    border: 1px solid var(--border);
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.titulo {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 15px 20px;
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
}

.titulo span {
    font-size: 32px;
}

.ativo-titulo { background: #166534 !important; }
.proximo-titulo { background: #ca8a04 !important; color: #000000 !important; }
.finalizado-titulo { background: #991b1b !important; }
.futuro-titulo { background: #1e40af !important; }

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    min-width: 1150px;
}

thead {
    background: var(--header);
}

th, td {
    padding: 14px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

tbody tr:hover {
    background: var(--hover);
}

th:nth-child(1), td:nth-child(1) { width: 14%; }
th:nth-child(2), td:nth-child(2) { width: 22%; }
th:nth-child(3), td:nth-child(3) { width: 18%; }
th:nth-child(4), td:nth-child(4) { width: 12%; }
th:nth-child(5), td:nth-child(5) { width: 12%; }
th:nth-child(6), td:nth-child(6) { width: 18%; }
th:nth-child(7), td:nth-child(7) { width: 4%; text-align: center; }

.check-all {
    width: 20px;
    height: 20px;
    cursor: pointer;
}

button {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    background: var(--header);
    color: var(--text);
    transition: background 0.2s;
}

button:hover {
    filter: brightness(1.1);
}

.erro {
    padding: 20px;
    text-align: center;
    color: #ef4444;
    font-weight: bold;
}

.vazio {
    padding: 20px;
    text-align: center;
    color: #94a3b8;
    font-style: italic;
}
</style>
</head>

<body>
<div class="topo">
    <div id="relogio"></div>
    <h1>PAINEL OPERACIONAL</h1>
    <button onclick="trocarTema()">🌙 / ☀️ Tema</button>
</div>

<!-- EM OPERAÇÃO -->
<div class="container">
    <h2 class="titulo ativo-titulo">
        <span>🚌</span> EM OPERAÇÃO
    </h2>
    <table>
        <thead>
            <tr>
                <th>CARRO</th>
                <th>MOTORISTA</th>
                <th>ROTA</th>
                <th>SAÍDA</th>
                <th>CHEGADA</th>
                <th>DESTINO</th>
                <th>
                    <input type="checkbox" id="selectAllAtivos" class="check-all" onclick="selecionarTodosAtivos()">
                </th>
            </tr>
        </thead>
        <tbody id="ativos"></tbody>
    </table>
</div>

<!-- PRÓXIMOS -->
<div class="container">
    <h2 class="titulo proximo-titulo">
        <span>⏳</span> PRÓXIMOS (30 MIN)
    </h2>
    <table>
        <thead>
            <tr>
                <th>CARRO</th>
                <th>MOTORISTA</th>
                <th>ROTA</th>
                <th>SAÍDA</th>
                <th>CHEGADA</th>
                <th>DESTINO</th>
                <th>
                    <input type="checkbox" id="selectAllProximos" class="check-all" onclick="selecionarTodosProximos()">
                </th>
            </tr>
        </thead>
        <tbody id="proximos"></tbody>
    </table>
</div>

<!-- FINALIZADOS -->
<div class="container">
    <h2 class="titulo finalizado-titulo">
        <span>🏁</span> FINALIZADOS
    </h2>
    <table>
        <thead>
            <tr>
                <th>CARRO</th>
                <th>MOTORISTA</th>
                <th>ROTA</th>
                <th>SAÍDA</th>
                <th>CHEGADA</th>
                <th>DESTINO</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="finalizados"></tbody>
    </table>
</div>

<!-- VIAGENS FUTURAS -->
<div class="container">
    <h2 class="titulo futuro-titulo">
        <span>📅</span> VIAGENS FUTURAS
    </h2>
    <table>
        <thead>
            <tr>
                <th>CARRO</th>
                <th>MOTORISTA</th>
                <th>ROTA</th>
                <th>SAÍDA</th>
                <th>CHEGADA</th>
                <th>DESTINO</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="futuras"></tbody>
    </table>
</div>

<script>
/* ==============================================
   CONFIGURAÇÕES E API
============================================== */
const API = "https://script.google.com/macros/s/AKfycbyt-QoodC39Oc0Ig8lRcfpriBUmqoAkkLiyOZxtTpnSQiL9QycksUzAe40xl0JUQyrgwQ/exec";
const TEMPO_EXIBIR_FINALIZADOS = 120; // minutos
const JANELA_PROXIMOS = 30; // minutos

let checkedStateAtivos = new Map();
let checkedStateProximos = new Map();
let carregando = false;

/* ==============================================
   UTILITÁRIOS
============================================== */
function escapeHtml(valor) {
    return String(valor ?? "—")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function gerarChave(item) {
    return [
        item.CARRO || "",
        item.MOTORISTA || "",
        item.ROTA || "",
        item.SAIDA || "",
        item.CHEGADA || "",
        item.DESTINO || ""
    ].join("|");
}

function normalizarItem(item) {
    return {
        CARRO: item?.CARRO ?? "—",
        MOTORISTA: item?.MOTORISTA ?? "—",
        ROTA: item?.ROTA ?? "—",
        SAIDA: item?.SAIDA ?? "—",
        CHEGADA: item?.CHEGADA ?? "—",
        DESTINO: item?.DESTINO ?? "—"
    };
}

/* ==============================================
   RELÓGIO
============================================== */
function atualizarRelogio() {
    const agora = new Date();
    document.getElementById("relogio").textContent = agora.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });
}
setInterval(atualizarRelogio, 1000);
atualizarRelogio();

/* ==============================================
   CONVERSÃO E FORMATAÇÃO DE HORAS
============================================== */
function horaParaMinutos(horaStr) {
    if (!horaStr || horaStr === "—" || String(horaStr).trim() === "") return null;

    const valor = String(horaStr).trim();

    // Formato HH:MM
    if (/^\d{1,2}:\d{2}$/.test(valor)) {
        const [h, m] = valor.split(":").map(Number);
        if (!isNaN(h) && !isNaN(m)) return h * 60 + m;
    }

    // Formato de data/hora ISO
    if (valor.includes("T")) {
        const data = new Date(valor);
        if (!isNaN(data.getTime())) {
            return data.getHours() * 60 + data.getMinutes();
        }
    }

    return null;
}

function formatarHora(horaStr) {
    if (!horaStr || horaStr === "—" || String(horaStr).trim() === "") return "—";

    const valor = String(horaStr).trim();

    if (/^\d{1,2}:\d{2}$/.test(valor)) {
        const [h, m] = valor.split(":").map(Number);
        return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    if (valor.includes("T")) {
        const data = new Date(valor);
        if (!isNaN(data.getTime())) {
            const h = String(data.getHours()).padStart(2, "0");
            const m = String(data.getMinutes()).padStart(2, "0");
            return `${h}:${m}`;
        }
    }

    return "—";
}

/* ==============================================
   CHECKBOXES
============================================== */
function salvarEstado(containerId, stateMap) {
    stateMap.clear();

    document.querySelectorAll(`#${containerId} input[type="checkbox"]`).forEach(cb => {
        if (cb.checked) {
            stateMap.set(cb.dataset.key, true);
        }
    });
}

function restaurarEstado(containerId, stateMap) {
    document.querySelectorAll(`#${containerId} input[type="checkbox"]`).forEach(cb => {
        cb.checked = stateMap.has(cb.dataset.key);
    });
}

function atualizarSelectAll(containerId, selectAllId) {
    const checkboxes = document.querySelectorAll(`#${containerId} input[type="checkbox"]`);
    const selectAll = document.getElementById(selectAllId);

    if (!checkboxes.length) {
        selectAll.checked = false;
        selectAll.indeterminate = false;
        return;
    }

    const marcados = [...checkboxes].filter(cb => cb.checked).length;

    selectAll.checked = marcados === checkboxes.length;
    selectAll.indeterminate = marcados > 0 && marcados < checkboxes.length;
}

function selecionarTodos(containerId, selectAllId, stateMap) {
    const marcar = document.getElementById(selectAllId).checked;

    document.querySelectorAll(`#${containerId} input[type="checkbox"]`).forEach(cb => {
        cb.checked = marcar;
        if (marcar) {
            stateMap.set(cb.dataset.key, true);
        } else {
            stateMap.delete(cb.dataset.key);
        }
    });

    atualizarSelectAll(containerId, selectAllId);
}

function selecionarTodosAtivos() {
    selecionarTodos("ativos", "selectAllAtivos", checkedStateAtivos);
}

function selecionarTodosProximos() {
    selecionarTodos("proximos", "selectAllProximos", checkedStateProximos);
}

/* ==============================================
   RENDERIZAÇÃO
============================================== */
function criarLinha(item, tipo = "") {
    const chave = gerarChave(item);

    const checkbox = (tipo === "ativos" || tipo === "proximos")
        ? `<input type="checkbox" data-key="${escapeHtml(chave)}">`
        : "";

    return `
        <tr>
            <td>${escapeHtml(item.CARRO)}</td>
            <td>${escapeHtml(item.MOTORISTA)}</td>
            <td>${escapeHtml(item.ROTA)}</td>
            <td>${escapeHtml(formatarHora(item.SAIDA))}</td>
            <td>${escapeHtml(formatarHora(item.CHEGADA))}</td>
            <td>${escapeHtml(item.DESTINO)}</td>
            <td>${checkbox}</td>
        </tr>
    `;
}

function renderTabela(id, lista, tipo = "") {
    const tbody = document.getElementById(id);

    if (!lista.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="vazio">Nenhuma viagem nesta categoria</td></tr>`;
        return;
    }

    tbody.innerHTML = lista.map(item => criarLinha(item, tipo)).join("");
}

function exibirMensagemCarregando() {
    const mensagem = `<tr><td colspan="7" class="vazio">Carregando dados...</td></tr>`;
    document.getElementById("ativos").innerHTML = mensagem;
    document.getElementById("proximos").innerHTML = mensagem;
    document.getElementById("finalizados").innerHTML = mensagem;
    document.getElementById("futuras").innerHTML = mensagem;
}

/* ==============================================
   CLASSIFICAÇÃO DAS VIAGENS
============================================== */
function classificarViagens(dados) {
    const agora = new Date();
    const agoraMinutos = agora.getHours() * 60 + agora.getMinutes();

    const ativos = [];
    const proximos = [];
    const finalizados = [];
    const futuras = [];

    dados.forEach(itemOriginal => {
        const item = normalizarItem(itemOriginal);
        const minSaida = horaParaMinutos(item.SAIDA);
        const minChegada = horaParaMinutos(item.CHEGADA);

        if (minSaida === null) {
            futuras.push({ ...item, minSaida: 999999 });
            return;
        }

        const chegadaValida = minChegada !== null ? minChegada : (23 * 60 + 59);
        const limiteFinalizado = chegadaValida + TEMPO_EXIBIR_FINALIZADOS;

        if (agoraMinutos >= minSaida && agoraMinutos <= chegadaValida) {
            ativos.push({ ...item, minSaida });
        } else if (agoraMinutos > chegadaValida && agoraMinutos <= limiteFinalizado) {
            finalizados.push({ ...item, minSaida });
        } else if (minSaida > agoraMinutos && minSaida <= agoraMinutos + JANELA_PROXIMOS) {
            proximos.push({ ...item, minSaida });
        } else {
            futuras.push({ ...item, minSaida });
        }
    });

    const ordenar = (a, b) => a.minSaida - b.minSaida;

    ativos.sort(ordenar);
    proximos.sort(ordenar);
    finalizados.sort(ordenar);
    futuras.sort(ordenar);

    return { ativos, proximos, finalizados, futuras };
}

/* ==============================================
   CARREGAR DADOS
============================================== */
async function carregarDados() {
    if (carregando) return;
    carregando = true;

    try {
        salvarEstado("ativos", checkedStateAtivos);
        salvarEstado("proximos", checkedStateProximos);

        const resposta = await fetch(API, { cache: "no-store" });
        if (!resposta.ok) {
            throw new Error(`Erro HTTP: ${resposta.status}`);
        }

        const dados = await resposta.json();

        if (!Array.isArray(dados)) {
            throw new Error("A API não retornou uma lista válida.");
        }

        const { ativos, proximos, finalizados, futuras } = classificarViagens(dados);

        renderTabela("ativos", ativos, "ativos");
        renderTabela("proximos", proximos, "proximos");
        renderTabela("finalizados", finalizados);
        renderTabela("futuras", futuras);

        restaurarEstado("ativos", checkedStateAtivos);
        restaurarEstado("proximos", checkedStateProximos);

        atualizarSelectAll("ativos", "selectAllAtivos");
        atualizarSelectAll("proximos", "selectAllProximos");

    } catch (erro) {
        console.error("Erro ao carregar dados:", erro);

        const mensagem = `<tr><td colspan="7" class="erro">Não foi possível carregar os dados</td></tr>`;
        document.getElementById("ativos").innerHTML = mensagem;
        document.getElementById("proximos").innerHTML = mensagem;
        document.getElementById("finalizados").innerHTML = mensagem;
        document.getElementById("futuras").innerHTML = mensagem;

        document.getElementById("selectAllAtivos").checked = false;
        document.getElementById("selectAllAtivos").indeterminate = false;
        document.getElementById("selectAllProximos").checked = false;
        document.getElementById("selectAllProximos").indeterminate = false;
    } finally {
        carregando = false;
    }
}

/* ==============================================
   EVENTOS DOS CHECKBOXES
============================================== */
document.getElementById("ativos").addEventListener("change", (e) => {
    if (e.target.matches('input[type="checkbox"]')) {
        const key = e.target.dataset.key;
        if (e.target.checked) {
            checkedStateAtivos.set(key, true);
        } else {
            checkedStateAtivos.delete(key);
        }
        atualizarSelectAll("ativos", "selectAllAtivos");
    }
});

document.getElementById("proximos").addEventListener("change", (e) => {
    if (e.target.matches('input[type="checkbox"]')) {
        const key = e.target.dataset.key;
        if (e.target.checked) {
            checkedStateProximos.set(key, true);
        } else {
            checkedStateProximos.delete(key);
        }
        atualizarSelectAll("proximos", "selectAllProximos");
    }
});

/* ==============================================
   TEMA
============================================== */
function trocarTema() {
    document.body.classList.toggle("light");
    localStorage.setItem("tema", document.body.classList.contains("light"));
}

if (localStorage.getItem("tema") === "true") {
    document.body.classList.add("light");
}

/* ==============================================
   INICIALIZAÇÃO
============================================== */
exibirMensagemCarregando();
carregarDados();
setInterval(carregarDados, 10000);
</script>
</body>
</html>

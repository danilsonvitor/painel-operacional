<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DISPLAY</title>

<style>

:root{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#ffffff;
    --header:#334155;
    --border:#475569;
}

.light{
    --bg:#f1f5f9;
    --card:#ffffff;
    --text:#0f172a;
    --header:#cbd5e1;
    --border:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:var(--bg);
    color:var(--text);
    padding:20px;
    transition:0.3s;
}

.topo{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

h1{
    font-size:34px;
    text-align:center;
    flex:1;
}

#relogio{
    font-size:38px;
    font-weight:bold;
    font-family:'Courier New', monospace;
    letter-spacing:4px;
    background:rgba(0,0,0,0.4);
    padding:8px 18px;
    border-radius:12px;
    border:2px solid #475569;
}

.container{
    background:var(--card);
    border-radius:15px;
    overflow:auto;
    border:1px solid var(--border);
    margin-bottom:25px;
}

.titulo{
    display:flex;
    align-items:center;
    gap:15px;
    padding:15px 20px;
    font-size:22px;
    font-weight:bold;
    color:white;
}

.titulo span{
    font-size:32px;
}

/* ==================== TÍTULOS ==================== */

.ativo-titulo{
    background:#166534 !important;
}

.proximo-titulo{
    background:#ca8a04 !important;
    color:black;
}

.finalizado-titulo{
    background:#991b1b !important;
}

.futuro-titulo{
    background:#1e40af !important;
}

/* ==================== TABELA ==================== */

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    min-width:1150px;
}

thead{
    background:var(--header);
}

th, td{
    padding:14px 12px;
    text-align:left;
    border-bottom:1px solid var(--border);
}

/* ==================== COLUNAS ==================== */

th:nth-child(1), td:nth-child(1){ width:8%; }
th:nth-child(2), td:nth-child(2){ width:16%; }
th:nth-child(3), td:nth-child(3){ width:18%; }
th:nth-child(4), td:nth-child(4){ width:12%; }
th:nth-child(5), td:nth-child(5){ width:12%; }
th:nth-child(6), td:nth-child(6){ width:22%; }
th:nth-child(7), td:nth-child(7){ width:6%; }

.check-all{
    width:20px;
    height:20px;
    cursor:pointer;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="topo">

    <div id="relogio"></div>

    <h1>PAINEL OPERACIONAL</h1>

    <button onclick="trocarTema()">
        🌙 / ☀️ Tema
    </button>

</div>

<!-- ==================== EM OPERAÇÃO ==================== -->

<div class="container">

    <h2 class="titulo ativo-titulo">
        <span>🚌</span>
        EM OPERAÇÃO
    </h2>

    <table>

        <thead>
            <tr>

                <th>CARRO</th>
                <th>MOTORISTA</th>
                <th>ROTA</th>
                <th>SAÍDA</th>
                <th>CHEGADA</th>
                <th>DESTINO</th>

                <th>
                    <input
                        type="checkbox"
                        id="selectAllAtivos"
                        class="check-all"
                        onclick="selecionarTodosAtivos()"
                    >
                </th>

            </tr>
        </thead>

        <tbody id="ativos"></tbody>

    </table>

</div>

<!-- ==================== PRÓXIMOS ==================== -->

<div class="container">

    <h2 class="titulo proximo-titulo">
        <span>⏳</span>
        PRÓXIMOS (30 MIN)
    </h2>

    <table>

        <thead>
            <tr>

                <th>CARRO</th>
                <th>MOTORISTA</th>
                <th>ROTA</th>
                <th>SAÍDA</th>
                <th>CHEGADA</th>
                <th>DESTINO</th>
                <th></th>

            </tr>
        </thead>

        <tbody id="proximos"></tbody>

    </table>

</div>

<!-- ==================== FINALIZADOS ==================== -->

<div class="container">

    <h2 class="titulo finalizado-titulo">
        <span>🏁</span>
        FINALIZADOS
    </h2>

    <table>

        <thead>
            <tr>

                <th>CARRO</th>
                <th>MOTORISTA</th>
                <th>ROTA</th>
                <th>SAÍDA</th>
                <th>CHEGADA</th>
                <th>DESTINO</th>
                <th></th>

            </tr>
        </thead>

        <tbody id="finalizados"></tbody>

    </table>

</div>

<!-- ==================== FUTURAS ==================== -->

<div class="container">

    <h2 class="titulo futuro-titulo">
        <span>📅</span>
        VIAGENS FUTURAS
    </h2>

    <table>

        <thead>
            <tr>

                <th>CARRO</th>
                <th>MOTORISTA</th>
                <th>ROTA</th>
                <th>SAÍDA</th>
                <th>CHEGADA</th>
                <th>DESTINO</th>
                <th></th>

            </tr>
        </thead>

        <tbody id="futuras"></tbody>

    </table>

</div>

<script>

/* =========================================================
   API
========================================================= */

const API = "https://script.google.com/macros/s/AKfycbyt-QoodC39Oc0Ig8lRcfpriBUmqoAkkLiyOZxtTpnSQiL9QycksUzAe40xl0JUQyrgwQ/exec";

/* =========================================================
   CHECKBOX
========================================================= */

let checkedState = new Map();

/* =========================================================
   RELÓGIO
========================================================= */

function atualizarRelogio(){

    const agora = new Date();

    document.getElementById("relogio").innerHTML =
        agora.toLocaleTimeString('pt-BR');
}

setInterval(atualizarRelogio, 1000);

atualizarRelogio();

/* =========================================================
   CONVERTER HORA PARA MINUTOS
========================================================= */

function horaParaMinutos(hora){

    /* =====================================================
       GOOGLE SHEETS
       1899-12-30T08:30:00.000Z
    ===================================================== */

    if(String(hora).includes("T")){

        const data = new Date(hora);

        return (
            data.getUTCHours() * 60
        ) + data.getUTCMinutes();
    }

    /* =====================================================
       FORMATO NORMAL
       08:30
    ===================================================== */

    const [h, m] = String(hora)
        .substring(0,5)
        .split(":")
        .map(Number);

    return (h * 60) + m;
}

/* =========================================================
   FORMATAR HORA
========================================================= */

function formatarHora(hora){

    if(String(hora).includes("T")){

        const data = new Date(hora);

        const h = String(data.getUTCHours())
            .padStart(2, "0");

        const m = String(data.getUTCMinutes())
            .padStart(2, "0");

        return `${h}:${m}`;
    }

    return String(hora).substring(0,5);
}

/* =========================================================
   CHECKBOX
========================================================= */

function salvarEstadoChecks(){

    checkedState.clear();

    document.querySelectorAll(
        '#ativos input[type="checkbox"]'
    ).forEach(checkbox => {

        if(checkbox.checked){

            const carro =
                checkbox.closest('tr')
                .cells[0]
                .textContent
                .trim();

            checkedState.set(carro, true);
        }
    });
}

function restaurarEstadoChecks(){

    document.querySelectorAll(
        '#ativos input[type="checkbox"]'
    ).forEach(checkbox => {

        const carro =
            checkbox.closest('tr')
            .cells[0]
            .textContent
            .trim();

        if(checkedState.has(carro)){

            checkbox.checked = true;
        }
    });
}

function selecionarTodosAtivos(){

    const isChecked =
        document.getElementById("selectAllAtivos").checked;

    document.querySelectorAll(
        '#ativos input[type="checkbox"]'
    ).forEach(cb => {

        cb.checked = isChecked;
    });
}

/* =========================================================
   CRIAR LINHA
========================================================= */

function criarLinha(item, checkbox = false){

    return `
        <tr>

            <td>${item.CARRO}</td>

            <td>${item.MOTORISTA}</td>

            <td>${item.ROTA || "—"}</td>

            <td>${formatarHora(item.SAIDA)}</td>

            <td>${formatarHora(item.CHEGADA)}</td>

            <td>${item.DESTINO}</td>

            <td>
                ${
                    checkbox
                    ? '<input type="checkbox">'
                    : ''
                }
            </td>

        </tr>
    `;
}

/* =========================================================
   CARREGAR DADOS
========================================================= */

async function carregarDados(){

    try{

        salvarEstadoChecks();

        const response = await fetch(API);

        const dados = await response.json();

        /* =================================================
           LIMPA PAINÉIS
        ================================================= */

        document.getElementById("ativos").innerHTML = "";
        document.getElementById("proximos").innerHTML = "";
        document.getElementById("finalizados").innerHTML = "";
        document.getElementById("futuras").innerHTML = "";

        /* =================================================
           HORA ATUAL
        ================================================= */

        const agora = new Date();

        const agoraMinutos =
            (agora.getHours() * 60)
            + agora.getMinutes();

        /* =================================================
           LISTAS
        ================================================= */

        const ativosLista = [];
        const proximosLista = [];
        const finalizadosLista = [];
        const futurasLista = [];

        /* =================================================
           PROCESSAR DADOS
        ================================================= */

        dados.forEach(item => {

            const minutosSaida =
                horaParaMinutos(item.SAIDA);

            const minutosChegada =
                horaParaMinutos(item.CHEGADA);

            /* =============================================
               MANTER EM FINALIZADOS POR 2H
            ============================================= */

            const limiteFinalizado =
                minutosChegada + 120;

            /* =============================================
               EM OPERAÇÃO
            ============================================= */

            if(
                agoraMinutos >= minutosSaida &&
                agoraMinutos <= minutosChegada
            ){

                ativosLista.push({
                    ...item,
                    minutosSaida
                });
            }

            /* =============================================
               FINALIZADOS
            ============================================= */

            else if(
                agoraMinutos > minutosChegada &&
                agoraMinutos <= limiteFinalizado
            ){

                finalizadosLista.push({
                    ...item,
                    minutosSaida
                });
            }

            /* =============================================
               PRÓXIMOS 30 MINUTOS
            ============================================= */

            else if(
                minutosSaida > agoraMinutos &&
                minutosSaida <= agoraMinutos + 30
            ){

                proximosLista.push({
                    ...item,
                    minutosSaida
                });
            }

            /* =============================================
               FUTURAS
            ============================================= */

            else{

                futurasLista.push({
                    ...item,
                    minutosSaida
                });
            }
        });

        /* =================================================
           ORDENAÇÃO DECRESCENTE
        ================================================= */

        ativosLista.sort((a,b) =>
            b.minutosSaida - a.minutosSaida
        );

        proximosLista.sort((a,b) =>
            b.minutosSaida - a.minutosSaida
        );

        finalizadosLista.sort((a,b) =>
            b.minutosSaida - a.minutosSaida
        );

        futurasLista.sort((a,b) =>
            b.minutosSaida - a.minutosSaida
        );

        /* =================================================
           RENDERIZAR
        ================================================= */

        ativosLista.forEach(item => {

            document.getElementById("ativos").innerHTML +=
                criarLinha(item, true);
        });

        proximosLista.forEach(item => {

            document.getElementById("proximos").innerHTML +=
                criarLinha(item);
        });

        finalizadosLista.forEach(item => {

            document.getElementById("finalizados").innerHTML +=
                criarLinha(item);
        });

        futurasLista.forEach(item => {

            document.getElementById("futuras").innerHTML +=
                criarLinha(item);
        });

        restaurarEstadoChecks();

    }catch(error){

        console.error(
            "Erro ao carregar dados:",
            error
        );
    }
}

/* =========================================================
   INICIAR
========================================================= */

carregarDados();

/* =========================================================
   ATUALIZA A CADA 10 SEGUNDOS
========================================================= */

setInterval(carregarDados, 10000);

/* =========================================================
   TEMA
========================================================= */

function trocarTema(){

    document.body.classList.toggle("light");

    localStorage.setItem(
        "tema",
        document.body.classList.contains("light")
    );
}

/* =========================================================
   CARREGAR TEMA
========================================================= */

if(localStorage.getItem("tema") === "true"){

    document.body.classList.add("light");
}

</script>

</body>
</html>
